<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5th Grade Math Quiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #f0f4f8;
    color: #2d3748;
    min-height: 100vh;
  }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #718096;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  /* Test selector */
  .selector {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
  }

  .selector button {
    flex: 1;
    padding: 14px 12px;
    border: 2px solid #cbd5e0;
    border-radius: 10px;
    background: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }

  .selector button:hover { border-color: #4299e1; color: #2b6cb0; }
  .selector button.active-pre { border-color: #48bb78; background: #f0fff4; color: #276749; }
  .selector button.active-end { border-color: #ed8936; background: #fffaf0; color: #9c4221; }

  /* Progress */
  .progress-bar {
    height: 8px;
    background: #e2e8f0;
    border-radius: 4px;
    margin-bottom: 24px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s;
  }

  .progress-fill.pre { background: #48bb78; }
  .progress-fill.end { background: #ed8936; }

  .progress-text {
    text-align: right;
    font-size: 0.82rem;
    color: #a0aec0;
    margin-top: -20px;
    margin-bottom: 16px;
  }

  /* Question card */
  .question-card {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 20px;
  }

  .q-number {
    font-size: 0.8rem;
    font-weight: 700;
    color: #a0aec0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .q-text {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 18px;
    line-height: 1.4;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .opt-btn {
    padding: 12px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    background: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.12s;
  }

  .opt-btn:hover:not(.locked) { border-color: #4299e1; background: #ebf8ff; }
  .opt-btn.correct { border-color: #48bb78; background: #f0fff4; color: #276749; }
  .opt-btn.wrong { border-color: #fc8181; background: #fff5f5; color: #9b2c2c; }
  .opt-btn.locked { cursor: default; opacity: 0.65; }
  .opt-btn.correct.locked { opacity: 1; }

  .skill-tag {
    margin-top: 12px;
    font-size: 0.82rem;
    color: #718096;
    font-style: italic;
  }

  /* Nav */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  .nav-btn {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }

  .nav-btn.prev { background: #e2e8f0; color: #4a5568; }
  .nav-btn.prev:hover { background: #cbd5e0; }
  .nav-btn.next { background: #4299e1; color: #fff; }
  .nav-btn.next:hover { background: #3182ce; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }

  /* Results */
  .results {
    background: #fff;
    border-radius: 12px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  .score-big {
    font-size: 3rem;
    font-weight: 800;
  }

  .score-label {
    font-size: 1rem;
    color: #718096;
    margin-bottom: 20px;
  }

  .results-table {
    width: 100%;
    text-align: left;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 0.88rem;
  }

  .results-table th {
    border-bottom: 2px solid #e2e8f0;
    padding: 8px 6px;
    color: #a0aec0;
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
  }

  .results-table td {
    padding: 8px 6px;
    border-bottom: 1px solid #f0f4f8;
  }

  .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  .dot.g { background: #48bb78; }
  .dot.r { background: #fc8181; }

  .restart-btn {
    margin-top: 24px;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    background: #4299e1;
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }

  .restart-btn:hover { background: #3182ce; }

  @media (max-width: 500px) {
    .options { grid-template-columns: 1fr; }
    .selector { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>5th Grade Math Check-Up</h1>
  <p class="subtitle">Pick a quiz, answer all 10, see where you stand.</p>

  <!-- Test Selector -->
  <div class="selector">
    <button
      :class="{ 'active-pre': activeQuiz === 'pre' }"
      @click="selectQuiz('pre')">
      Pre-5th Grade Review
    </button>
    <button
      :class="{ 'active-end': activeQuiz === 'end' }"
      @click="selectQuiz('end')">
      End of 5th Grade
    </button>
  </div>

  <template v-if="activeQuiz && !showResults">
    <!-- Progress -->
    <div class="progress-bar">
      <div class="progress-fill" :class="activeQuiz === 'pre' ? 'pre' : 'end'"
           :style="{ width: ((currentQ + 1) / questions.length * 100) + '%' }"></div>
    </div>
    <p class="progress-text">{{ currentQ + 1 }} / {{ questions.length }}</p>

    <!-- Question -->
    <div class="question-card">
      <div class="q-number">Question {{ currentQ + 1 }}</div>
      <div class="q-text">{{ q.text }}</div>
      <div class="options">
        <button
          v-for="(opt, i) in q.options"
          :key="i"
          class="opt-btn"
          :class="{
            correct: answered[currentQ] !== null && i === q.answer,
            wrong: answered[currentQ] === i && i !== q.answer,
            locked: answered[currentQ] !== null && i !== answered[currentQ] && i !== q.answer
          }"
          @click="pick(i)">
          {{ letters[i] }}) {{ opt }}
        </button>
      </div>
      <div class="skill-tag" v-if="answered[currentQ] !== null">
        Skill: {{ q.skill }}
      </div>
    </div>

    <!-- Nav -->
    <div class="nav-row">
      <button class="nav-btn prev" :disabled="currentQ === 0" @click="currentQ--">← Back</button>
      <button class="nav-btn next" v-if="currentQ < questions.length - 1" @click="currentQ++">Next →</button>
      <button class="nav-btn next" v-else :disabled="answered.includes(null)" @click="finish">See Results</button>
    </div>
  </template>

  <!-- Results -->
  <div class="results" v-if="showResults">
    <div class="score-big">{{ correctCount }} / {{ questions.length }}</div>
    <div class="score-label">{{ scoreMessage }}</div>
    <table class="results-table">
      <thead><tr><th></th><th>Question</th><th>Skill</th></tr></thead>
      <tbody>
        <tr v-for="(q, i) in questions" :key="i">
          <td><span class="dot" :class="answered[i] === q.answer ? 'g' : 'r'"></span></td>
          <td>{{ i + 1 }}. {{ q.text.substring(0, 50) }}…</td>
          <td>{{ q.skill }}</td>
        </tr>
      </tbody>
    </table>
    <button class="restart-btn" @click="reset">Try Again</button>
  </div>
</div>

<script>
const { createApp, ref, computed } = Vue;

const preQuestions = [
  {
    text: "What is 347 + 586?",
    options: ["823","933","913","843","923","833","943","903"],
    answer: 1,
    skill: "Multi-digit addition"
  },
  {
    text: "What is 8 × 7?",
    options: ["54","48","64","56","63","42","49","58"],
    answer: 3,
    skill: "Multiplication facts"
  },
  {
    text: "What is the perimeter of a rectangle that is 6 in long and 4 in wide?",
    options: ["24 in","10 in","16 in","20 in","18 in","12 in","28 in","22 in"],
    answer: 3,
    skill: "Perimeter"
  },
  {
    text: "Which fraction is equivalent to 1/2?",
    options: ["2/5","4/6","3/5","3/6","2/3","1/3","4/10","5/8"],
    answer: 3,
    skill: "Equivalent fractions"
  },
  {
    text: "Round 4,738 to the nearest hundred.",
    options: ["4,800","4,740","5,000","4,700","4,730","4,750","4,830","4,600"],
    answer: 3,
    skill: "Rounding"
  },
  {
    text: "What is 963 − 487?",
    options: ["576","486","516","476","466","496","546","436"],
    answer: 3,
    skill: "Multi-digit subtraction"
  },
  {
    text: "Which of these numbers is a multiple of 6?",
    options: ["25","32","44","36","35","28","22","38"],
    answer: 3,
    skill: "Multiples"
  },
  {
    text: "What is the area of a rectangle that is 9 cm long and 5 cm wide?",
    options: ["28 cm²","14 cm²","54 cm²","45 cm²","40 cm²","36 cm²","50 cm²","35 cm²"],
    answer: 3,
    skill: "Area of rectangles"
  },
  {
    text: "What is 156 ÷ 4?",
    options: ["37","42","36","39","38","41","34","43"],
    answer: 3,
    skill: "Division"
  },
  {
    text: "Which fraction is greater: 3/4 or 2/3?",
    options: ["2/3","They are equal","Cannot compare","3/4","Need a calculator","Neither","2/4","3/3"],
    answer: 3,
    skill: "Comparing fractions"
  }
];

const endQuestions = [
  {
    text: "What is 3/4 + 2/3?",
    options: ["5/7","5/12","1 1/2","1 5/12","6/7","1 1/7","1 2/12","7/12"],
    answer: 3,
    skill: "Adding fractions (unlike denominators)"
  },
  {
    text: "What is 4.56 × 0.3?",
    options: ["13.68","0.1368","136.8","1.368","14.68","0.456","4.368","1.568"],
    answer: 3,
    skill: "Multiplying decimals"
  },
  {
    text: "Solve: 3 + 4 × 2 − 1",
    options: ["13","14","9","10","15","12","8","11"],
    answer: 3,
    skill: "Order of operations (PEMDAS)"
  },
  {
    text: "A box is 5 cm long, 3 cm wide, and 4 cm tall. What is its volume?",
    options: ["12 cm³","35 cm³","24 cm³","60 cm³","48 cm³","45 cm³","20 cm³","15 cm³"],
    answer: 3,
    skill: "Volume of rectangular prisms"
  },
  {
    text: "What is 3/5 × 2/7?",
    options: ["5/12","5/35","6/12","6/35","3/35","2/35","6/7","1/7"],
    answer: 3,
    skill: "Multiplying fractions"
  },
  {
    text: "How many inches are in 4 feet?",
    options: ["36","52","44","48","40","42","56","38"],
    answer: 3,
    skill: "Measurement conversion"
  },
  {
    text: "The point (3, 5) on a coordinate plane means:",
    options: ["3 up, 5 right","5 right, 3 up","5 down, 3 left","3 right, 5 up","3 left, 5 down","5 left, 3 up","3 down, 5 right","5 right, 3 down"],
    answer: 3,
    skill: "Coordinate plane"
  },
  {
    text: "What is 7.2 ÷ 0.8?",
    options: ["0.9","8","90","9","7.2","0.09","80","7"],
    answer: 3,
    skill: "Dividing decimals"
  },
  {
    text: "What is 10³ (10 to the third power)?",
    options: ["30","100","10,000","1,000","300","1,300","3,000","10"],
    answer: 3,
    skill: "Powers of 10"
  },
  {
    text: "What is 5 − 1 2/3?",
    options: ["4 1/3","3 2/3","4 2/3","3 1/3","2 2/3","4","3","2 1/3"],
    answer: 3,
    skill: "Subtracting mixed numbers"
  }
];

// Shuffle options for each question while keeping answer tracking correct
function shuffleQuestions(qs) {
  return qs.map(q => {
    const correctVal = q.options[q.answer];
    const shuffled = [...q.options];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return { ...q, options: shuffled, answer: shuffled.indexOf(correctVal) };
  });
}

createApp({
  setup() {
    const activeQuiz = ref(null);
    const questions = ref([]);
    const currentQ = ref(0);
    const answered = ref([]);
    const showResults = ref(false);
    const letters = "ABCDEFGH";

    const q = computed(() => questions.value[currentQ.value]);

    const correctCount = computed(() =>
      answered.value.filter((a, i) => a === questions.value[i].answer).length
    );

    const scoreMessage = computed(() => {
      const pct = correctCount.value / questions.value.length;
      if (pct === 1) return "Perfect! No gaps here.";
      if (pct >= 0.8) return "Strong — just a couple areas to review.";
      if (pct >= 0.6) return "Decent — some topics need more practice.";
      return "Let's focus on the skills marked red.";
    });

    function selectQuiz(type) {
      activeQuiz.value = type;
      questions.value = shuffleQuestions(type === 'pre' ? preQuestions : endQuestions);
      currentQ.value = 0;
      answered.value = new Array(10).fill(null);
      showResults.value = false;
    }

    function pick(i) {
      if (answered.value[currentQ.value] !== null) return;
      answered.value[currentQ.value] = i;
    }

    function finish() { showResults.value = true; }

    function reset() {
      showResults.value = false;
      activeQuiz.value = null;
    }

    return { activeQuiz, questions, currentQ, answered, showResults, letters, q,
             correctCount, scoreMessage, selectQuiz, pick, finish, reset };
  }
}).mount('#app');
</script>
</body>
</html>
